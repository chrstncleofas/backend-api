# Production compose — API only, no local MongoDB (uses Atlas via env vars)
# Usage: docker compose -f docker-compose.prod.yml up --build -d

services:
  api:
    build: .
    image: backend-api:latest
    container_name: backend-api
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend-network:
    driver: bridge
