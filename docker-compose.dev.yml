services:
  api:
    build: .
    container_name: backend-api-dev
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    environment:
      - GUNICORN_RELOAD=true
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend-network

  mongodb:
    image: mongo:7
    container_name: app-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:

networks:
  backend-network:
    driver: bridge
