services:
  api:
    build: .
    container_name: backend-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_NAME=ibay_backend
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - ibay-network

  mongodb:
    image: mongo:7
    container_name: ibay-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - ibay-network

volumes:
  mongodb_data:

networks:
  ibay-network:
    driver: bridge
