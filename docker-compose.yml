services:
  api:
    build: .
    container_name: backend-api
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      - mongodb
    restart: unless-stopped
    networks:
      - backend-network

  mongodb:
    image: mongo:7
    container_name: app-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - backend-network

volumes:
  mongodb_data:

networks:
  backend-network:
    driver: bridge
